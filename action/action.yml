name: "WhyDidThisFail?"
description: "Automatically diagnoses a failed CI job and posts the cause, explanation, and fix as a comment -- no manual log-pasting needed."
branding:
  icon: "help-circle"
  color: "purple"

inputs:
  github-token:
    description: "Token used to fetch job logs and post comments. Defaults to the workflow's own GITHUB_TOKEN."
    required: false
    default: ${{ github.token }}
  whyfail-api-url:
    description: "Base URL of the WhyDidThisFail? diagnosis API (Phase 1). Defaults to the CLI's own default."
    required: false
    default: ""
  website-url:
    description: "Base URL of the WhyDidThisFail? website (Phase 3), used to create a shareable result-page link in the comment. If unset, the comment is posted without a share link."
    required: false
    default: ""
  whyfail-cli:
    description: "How to invoke the whyfail CLI (Phase 2). Defaults to the published package via npx. Override for local/dogfood testing, e.g. \"node /path/to/cli/bin/cli.js\"."
    required: false
    default: "npx --yes whyfail@latest"
  job-name:
    description: "Only used with the workflow_run trigger: restrict diagnosis to failed jobs matching this name. If unset, all failed jobs in the run are diagnosed."
    required: false
    default: ""

outputs:
  posted:
    description: "\"true\" if a comment was posted, \"false\" otherwise (e.g. nothing failed, or logs could not be retrieved)."

runs:
  using: "node20"
  main: "src/index.js"
